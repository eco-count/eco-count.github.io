<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Eco Count — Track your plastic footprint</title>
  <desc id="desc">A green editorial banner with a plastic bottle surrounded by a continuously orbiting recycling loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f8e9"/><stop offset=".58" stop-color="#e4f0d5"/><stop offset="1" stop-color="#d4e7c2"/></linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fcf9a"/><stop offset=".48" stop-color="#d3f0cb"/><stop offset="1" stop-color="#69b97c"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#438d54"/><stop offset="1" stop-color="#78b968"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2c653d" flood-opacity=".15"/></filter>
    <clipPath id="bottleMask"><path d="M760 111h32v26c0 10 9 15 16 24 8 10 11 23 11 39v93c0 20-13 34-33 34h-41c-20 0-33-14-33-34v-93c0-16 4-29 12-39 7-9 16-14 16-24v-26z"/></clipPath>
    <path id="orbitArrow" d="M0 -112 A112 112 0 0 1 96 -57 l-20 2 29 31 17-39-17 6 A132 132 0 0 0 0 -132 Z"/>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="955" cy="201" r="166" fill="#d0e6bf" opacity=".52"/>
  <circle cx="955" cy="201" r="133" fill="none" stroke="#9fc99a" stroke-width="1.5" stroke-dasharray="3 9" opacity=".75"/>
  <path d="M0 330C145 295 211 368 340 342s205-35 317 8 219 8 300-12 151-12 243 15v47H0z" fill="#c7dfb6" opacity=".55"/>
  <g fill="#4b8752" opacity=".18"><circle cx="1047" cy="64" r="5"/><circle cx="1090" cy="108" r="3"/><circle cx="858" cy="63" r="4"/><circle cx="1104" cy="292" r="5"/><circle cx="852" cy="310" r="3"/></g>
  <g transform="translate(82 0)">
    <text x="0" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="5" fill="#4f8b54">A SMALL STEP. A BIGGER IMPACT.</text>
    <text x="-2" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5" fill="#204f32">Eco <tspan fill="#5a9d52">Count</tspan></text>
    <rect x="0" y="250" width="76" height="5" rx="2.5" fill="#6baa5d"/>
    <text x="0" y="289" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500" fill="#52745a">Make your plastic footprint count.</text>
    <g transform="translate(0 322)" fill="#6c9f66" opacity=".75"><circle cx="6" cy="0" r="3"/><circle cx="20" cy="0" r="3"/><circle cx="34" cy="0" r="3"/><path d="M48 0h54" stroke="#6c9f66" stroke-width="2" stroke-linecap="round"/></g>
  </g>
  <!-- Orbit path is split into front and back halves. The rear half is dimmed behind the bottle. -->
  <g transform="translate(955 202)">
    <circle r="112" fill="none" stroke="#7ab66d" stroke-width="2" stroke-dasharray="3 10" opacity=".45"/>
    <g opacity=".34" fill="#2d8650">
      <path d="M0 -126 A126 126 0 0 0 0 126" fill="none" stroke="#2d8650" stroke-width="13" stroke-linecap="round" stroke-dasharray="1 1000"/>
    </g>
    <g id="orbitBack" fill="#398e55" opacity=".62">
      <path d="M-8 -105 A105 105 0 0 0 -8 105" fill="none" stroke="#398e55" stroke-width="12" stroke-linecap="round"/>
      <path d="M-12 92l4 25 22-14z"/>
    </g>
    <g id="orbitingMark">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <path d="M0 -125 A125 125 0 0 1 108 -62" fill="none" stroke="#2f8b50" stroke-width="13" stroke-linecap="round"/>
      <path d="M96 -78l31 15-7-34z" fill="#2f8b50"/>
      <path d="M108 -62 A125 125 0 0 1 108 62" fill="none" stroke="#68ad55" stroke-width="13" stroke-linecap="round"/>
      <path d="M95 78l32-15-7 34z" fill="#68ad55"/>
      <path d="M108 62 A125 125 0 0 1 0 125" fill="none" stroke="#2f8b50" stroke-width="13" stroke-linecap="round"/>
      <path d="M17 107l-17 31-17-31z" fill="#2f8b50"/>
    </g>
    <!-- Bottle sits above the rear orbit; the front orbit returns over it. -->
    <g id="bottle" filter="url(#shadow)">
      <path d="M-16 -103h32v24c0 10 9 15 16 24 8 10 11 23 11 39v93c0 20-13 34-33 34h-41c-20 0-33-14-33-34v-93c0-16 4-29 12-39 7-9 16-14 16-24v-24z" fill="url(#bottle)" stroke="#438d5a" stroke-width="3"/>
      <rect x="-18" y="-126" width="36" height="25" rx="5" fill="#2d8050"/>
      <path d="M-18 -118h36M-17 -111h34" stroke="#9dd49c" stroke-width="2" opacity=".7"/>
      <path d="M-28 -43v88" stroke="#eff9df" stroke-width="8" stroke-linecap="round" opacity=".75"/>
      <path d="M-23 13h46" stroke="#438d5a" stroke-width="2" opacity=".6"/>
      <g transform="translate(0 11)" fill="none" stroke="#2f8050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-18 0l10-17 10 17h-8"/><path d="M5 -14l16 3-7 12"/><path d="M16 8l-10 15-9-15h8"/>
      </g>
      <path d="M-35 66h70" stroke="#e6f5d9" stroke-width="2" opacity=".6"/>
    </g>
    <!-- Small foreground arc creates the over/under orbit illusion. -->
    <path d="M-88 88 A125 125 0 0 0 88 88" fill="none" stroke="#68ad55" stroke-width="13" stroke-linecap="round"/>
    <path d="M72 92l29 5-15-29z" fill="#68ad55"/>
  </g>
  <g transform="translate(1087 342)" fill="#4b8c50"><path d="M0 0C-22-23-42-14-42-14-36 7-16 14 0 0z"/><path d="M0 0C3-26 23-34 23-34 34-13 18 1 0 0z"/><path d="M-1 1l-18-13M1 0l14-23" fill="none" stroke="#dcefd0" stroke-width="2" stroke-linecap="round"/></g>
</svg>
